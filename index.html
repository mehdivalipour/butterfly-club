<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f2ec" />
  <title>Butterfly Club</title>
  <style>
    :root {
      --bg: #f7f2ec;
      --bg2: #eee6dc;
      --text: #2d2926;
      --muted: #7d746b;
      --line: rgba(45,41,38,.10);
      --line-strong: rgba(45,41,38,.17);
      --glass: rgba(255,255,255,.30);
      --glass-focus: rgba(255,255,255,.42);
      --pill: rgba(255,255,255,.40);
      --shadow: 0 14px 38px rgba(45,41,38,.05);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      color: var(--text);
      background:
        radial-gradient(circle at 14% 14%, rgba(255,255,255,.60), transparent 24%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
    }

    button, input { font: inherit; }

    .page {
      position: relative;
      width: 100%;
      height: 100dvh;
      min-height: 100dvh;
      padding: max(24px, env(safe-area-inset-top)) 20px max(22px, env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .page::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 84% 18%, rgba(255,255,255,.20), transparent 20%),
        radial-gradient(circle at 50% 48%, rgba(255,255,255,.13), transparent 38%);
    }

    .hero {
      position: relative;
      z-index: 1;
      width: min(100%, 900px);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 17px;
      transform: translateY(-7vh);
    }

    .logo-button {
      appearance: none;
      background: transparent;
      border: 0;
      padding: 0;
      margin: 0;
      cursor: pointer;
      transform: scale(1);
      transition: filter .25s ease;
    }

    .logo-button:hover { filter: brightness(1.025); }

    .logo-button.zoom {
      animation: butterflyZoom 3s cubic-bezier(.22,.72,.24,1) forwards;
    }

    @keyframes butterflyZoom {
      from { transform: scale(1); }
      to   { transform: scale(1.13); }
    }

    .butterfly {
      width: clamp(112px, 10vw, 150px);
      height: auto;
      display: block;
      filter: drop-shadow(0 9px 22px rgba(88,67,49,.08));
      user-select: none;
      -webkit-user-drag: none;
    }

    .title {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(38px, 5vw, 68px);
      font-weight: 400;
      line-height: .96;
      letter-spacing: -.045em;
    }

    .text-slot {
      width: min(100%, 760px);
      min-height: 28px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-inline: 8px;
    }

    .tagline, .question {
      margin: 0;
      color: var(--muted);
    }

    .tagline {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(12px, 1.25vw, 17px);
      letter-spacing: .22em;
      white-space: nowrap;
      opacity: 1;
      transition: opacity .22s ease;
    }

    .tagline.hidden {
      opacity: 0;
      pointer-events: none;
      position: absolute;
    }

    .question {
      position: absolute;
      opacity: 0;
      pointer-events: none;
      font-size: clamp(11px, 3.55vw, 16px);
      line-height: 1.2;
      white-space: nowrap;
      max-width: 100%;
      overflow: hidden;
      text-overflow: clip;
      transition: opacity .20s ease;
    }

    .question.visible {
      position: static;
      opacity: 1;
      pointer-events: auto;
    }

    .question.typing::after {
      content: "|";
      display: inline-block;
      margin-left: 3px;
      color: #938980;
      animation: blink 1s step-end infinite;
    }

    @keyframes blink { 50% { opacity: 0; } }

    .chat-shell {
      position: fixed;
      z-index: 2;
      left: 50%;
      bottom: max(26px, env(safe-area-inset-bottom));
      width: min(calc(100% - 32px), 520px);
      transform: translate(-50%, 12px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition:
        opacity 1.25s cubic-bezier(.2,.7,.2,1),
        transform 1.25s cubic-bezier(.2,.7,.2,1),
        visibility 0s linear 1.25s;
    }

    .chat-shell.visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translate(-50%, 0);
      transition-delay: 0s;
    }

    .messages {
      width: 100%;
      min-height: 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .message {
      max-width: 100%;
      padding: 8px 12px;
      border-radius: 18px;
      border: 1px solid rgba(45,41,38,.055);
      background: var(--pill);
      color: var(--muted);
      font-size: 12.5px;
      line-height: 1.55;
      backdrop-filter: blur(12px);
      box-shadow: 0 6px 18px rgba(45,41,38,.025);
      animation: messageIn .35s ease both;
      text-align: center;
    }

    .message strong { color: var(--text); font-weight: 600; }
    .message.error { color: #7b473e; }

    @keyframes messageIn {
      from { opacity: 0; transform: translateY(5px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message.fade-away {
      animation:
        messageIn .35s ease both,
        messageFadeOut 1.8s ease 3.2s forwards;
    }

    @keyframes messageFadeOut {
      from { opacity: 1; transform: translateY(0); }
      to   { opacity: 0; transform: translateY(-3px); }
    }

    .chat-input {
      width: 100%;
      min-height: 52px;
      padding: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--glass);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      transition: background .2s ease, border-color .2s ease, opacity .2s ease;
    }

    .chat-input:focus-within {
      border-color: var(--line-strong);
      background: var(--glass-focus);
    }

    .chat-input.disabled {
      opacity: .55;
      pointer-events: none;
    }

    .chat-input.hidden { display: none; }

    .answer-input {
      flex: 1;
      min-width: 0;
      height: 40px;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      padding: 0 12px;
      font-size: 14px;
    }

    .answer-input::placeholder { color: #9f958b; }

    .send-btn {
      width: 40px;
      height: 40px;
      flex: 0 0 auto;
      border: 0;
      border-radius: 50%;
      background: #e5dbd0;
      color: var(--text);
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      transition: transform .18s ease, background .18s ease;
    }

    .send-btn:hover {
      transform: translateY(-1px);
      background: #ddd1c4;
    }

    .micro-status {
      min-height: 15px;
      color: var(--muted);
      opacity: .78;
      font-size: 10.5px;
      line-height: 1.35;
      text-align: center;
    }

    @media (max-width: 640px) {
      .page {
        padding-left: 16px;
        padding-right: 16px;
      }

      .hero {
        gap: 14px;
        transform: translateY(-8vh);
      }

      .butterfly {
        width: clamp(105px, 31vw, 132px);
      }

      .title {
        font-size: clamp(38px, 13vw, 54px);
      }

      .tagline {
        font-size: clamp(10px, 3.5vw, 13px);
        letter-spacing: .17em;
      }

      .question {
        font-size: clamp(10px, 3.45vw, 14px);
      }

      .chat-shell {
        width: calc(100% - 24px);
        bottom: max(14px, env(safe-area-inset-bottom));
      }
    }

    @media (max-width: 360px) {
      .question { font-size: 10.5px; }
      .tagline { font-size: 10.5px; }
      .message { font-size: 11.5px; }
      .answer-input { font-size: 13px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

      <h1 class="title">Butterfly Club</h1>

      <div class="text-slot">
        <p class="tagline" id="tagline">Small ideas. Big consequences.</p>
        <p class="question" id="questionText" aria-live="polite"></p>
      </div>
    </section>

    <section class="chat-shell" id="chatShell" aria-live="polite">
      <div class="messages" id="messages"></div>

      <div class="chat-input disabled" id="chatInput">
        <input
          id="answerInput"
          class="answer-input"
          type="text"
          placeholder="Your answer..."
          maxlength="700"
          autocomplete="off"
          disabled
        />
        <button id="sendBtn" class="send-btn" type="button" aria-label="Send" disabled>↑</button>
      </div>

      <div class="micro-status" id="microStatus"></div>
    </section>
  </main>

  <script>
    /*
      DEPLOYMENT:
      1) Deploy the Cloudflare Worker included in this package.
      2) Replace YOUR-WORKER below with its URL.
      The OpenAI API key NEVER belongs in this HTML file.
    */
    const API_BASE_URL = "https://butterfly-club-api.mehdivalipour-co.workers.dev";
    const DEMO_MODE = API_BASE_URL.includes("YOUR-WORKER");

    const QUESTIONS = [
      "Why do you want to join?",
      "What do you bring to the room?",
      "What are you obsessed with right now?"
    ];

    const logoTrigger = document.getElementById("logoTrigger");
    const tagline = document.getElementById("tagline");
    const questionText = document.getElementById("questionText");
    const chatShell = document.getElementById("chatShell");
    const chatInput = document.getElementById("chatInput");
    const answerInput = document.getElementById("answerInput");
    const sendBtn = document.getElementById("sendBtn");
    const messages = document.getElementById("messages");
    const microStatus = document.getElementById("microStatus");

    let started = false;
    let currentQuestion = 0;
    let mode = "questions";
    let answers = [];
    let applicationId = null;
    let submissionToken = null;
    let typeTimer = null;

    const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

    function setInputEnabled(enabled) {
      answerInput.disabled = !enabled;
      sendBtn.disabled = !enabled;
      chatInput.classList.toggle("disabled", !enabled);
      if (enabled) requestAnimationFrame(() => answerInput.focus());
    }

    function setMicroStatus(text = "") {
      microStatus.textContent = text;
    }

    function addMessage(html, type = "") {
      const div = document.createElement("div");
      div.className = `message ${type}`.trim();
      div.innerHTML = html;
      messages.appendChild(div);
      return div;
    }

    function setMessage(html, type = "") {
      messages.innerHTML = "";
      return addMessage(html, type);
    }

    function clearMessages() {
      messages.innerHTML = "";
    }

    function showTagline() {
      questionText.classList.remove("visible", "typing");
      questionText.textContent = "";
      tagline.classList.remove("hidden");
    }

    function showQuestionArea() {
      tagline.classList.add("hidden");
      questionText.classList.add("visible");
    }

    function typeQuestion(text, speed = 48) {
      return new Promise(resolve => {
        clearTimeout(typeTimer);
        showQuestionArea();
        questionText.textContent = "";
        questionText.classList.add("typing");

        let index = 0;
        const tick = () => {
          questionText.textContent = text.slice(0, index);
          index += 1;

          if (index <= text.length) {
            typeTimer = setTimeout(tick, speed);
          } else {
            questionText.classList.remove("typing");
            resolve();
          }
        };

        tick();
      });
    }

    async function startFlow() {
      if (started) return;
      started = true;
      logoTrigger.disabled = true;

      // 2s stillness -> 3s slow zoom.
      await sleep(2000);
      logoTrigger.classList.add("zoom");

      await sleep(3000);

      // 2s after zoom finishes -> chatbot fades in.
      await sleep(2000);
      chatShell.classList.add("visible");

      // 5s after chatbot appears -> first question begins typing.
      await sleep(5000);
      await typeQuestion(QUESTIONS[0]);

      setInputEnabled(true);
    }

    async function demoEvaluate(payload) {
      await sleep(1300);
      const combined = payload.answers.join(" ").trim();
      const score = Math.min(
        92,
        48 +
        payload.answers.filter(a => a.length >= 28).length * 8 +
        (combined.length > 140 ? 12 : 0)
      );

      return {
        decision: score >= 64 ? "accept" : "reject",
        score,
        applicationId: "demo-" + Date.now(),
        submissionToken: "demo-token"
      };
    }

    async function evaluateApplication() {
      const payload = { answers };

      if (DEMO_MODE) return demoEvaluate(payload);

      const response = await fetch(`${API_BASE_URL}/evaluate`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || "Evaluation failed.");
      return data;
    }

    async function submitContact(name, phone) {
      if (DEMO_MODE) {
        await sleep(700);
        return { ok: true };
      }

      const response = await fetch(`${API_BASE_URL}/submit`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          applicationId,
          submissionToken,
          name,
          phone
        })
      });

      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || "Submission failed.");
      return data;
    }

    async function handleQuestionAnswer(value) {
      answers.push(value.trim());
      answerInput.value = "";
      setInputEnabled(false);

      if (currentQuestion < QUESTIONS.length - 1) {
        currentQuestion += 1;
        await sleep(900);
        await typeQuestion(QUESTIONS[currentQuestion]);
        setInputEnabled(true);
        return;
      }

      // The questions disappear; the brand line returns while AI reviews.
      showTagline();
      clearMessages();
      setMicroStatus("Reviewing...");
      chatInput.classList.add("disabled");

      try {
        const result = await evaluateApplication();
        applicationId = result.applicationId || null;
        submissionToken = result.submissionToken || null;
        setMicroStatus("");

        if (result.decision === "accept") {
          mode = "name";
          setMessage("What's your name?");
          answerInput.placeholder = "Your name";
          answerInput.inputMode = "text";
          chatInput.classList.remove("disabled");
          setInputEnabled(true);
        } else {
          mode = "rejected";
          addMessage("<strong>Not accepted.</strong> Maybe another time.");
          chatInput.classList.add("hidden");
        }
      } catch (error) {
        console.error(error);
        addMessage("Something went wrong. Please try again.", "error");
        setMicroStatus("");
        chatInput.classList.remove("disabled");
        setInputEnabled(true);
      }
    }

    async function handleName(value) {
      window.__butterflyName = value.trim();
      mode = "contact";
      answerInput.value = "";
      setMessage("How can we reach you?");
      answerInput.placeholder = "Phone, email, Telegram...";
      answerInput.inputMode = "text";
      setInputEnabled(true);
    }

    async function handleContact(value) {
      setInputEnabled(false);
      setMicroStatus("Sending...");

      try {
        await submitContact(window.__butterflyName || "", value.trim());
        setMicroStatus("");
        mode = "done";
        chatInput.classList.add("hidden");
        const finalMessage = setMessage("<strong>Thank you.</strong> Your application is now in review.", "fade-away");
        setTimeout(() => {
          if (finalMessage?.isConnected) finalMessage.remove();
        }, 5200);
      } catch (error) {
        console.error(error);
        setMicroStatus("");
        setMessage("Couldn't save your details. Please try again.", "error");
        setInputEnabled(true);
      }
    }

    async function submitCurrent() {
      const value = answerInput.value.trim();
      if (!value || answerInput.disabled) return;

      if (mode === "questions") {
        await handleQuestionAnswer(value);
      } else if (mode === "name") {
        if (value.length < 2) {
          addMessage("Please enter your name.", "error");
          return;
        }
        await handleName(value);
      } else if (mode === "contact") {
        await handleContact(value);
      }
    }

    logoTrigger.addEventListener("click", startFlow);
    sendBtn.addEventListener("click", submitCurrent);
    answerInput.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        event.preventDefault();
        submitCurrent();
      }
    });
  </script>
</body>
</html>
