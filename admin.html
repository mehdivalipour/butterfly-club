<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f2ec" />
  <title>Butterfly Club — Admin</title>
  <style>
    :root {
      --bg:#f7f2ec;
      --panel:rgba(255,255,255,.42);
      --panel-strong:rgba(255,255,255,.62);
      --text:#2d2926;
      --muted:#7a7168;
      --line:rgba(45,41,38,.09);
      --line-strong:rgba(45,41,38,.15);
      --good:#48654d;
      --bad:#815047;
      --wait:#8a714a;
      --shadow:0 20px 60px rgba(45,41,38,.06);
    }

    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:linear-gradient(180deg,#f8f4ef 0%,#efe7dd 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif}
    body{min-height:100vh}
    button,input{font:inherit}

    .wrap{width:min(1180px,calc(100% - 32px));margin:0 auto;padding:34px 0 70px}
    .topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:28px}
    .brand h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(34px,5vw,58px);font-weight:400;letter-spacing:-.045em;line-height:.95}
    .brand p{margin:10px 0 0;color:var(--muted);font-size:13px;letter-spacing:.08em}
    .actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

    .btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;padding:10px 14px;cursor:pointer;transition:.18s ease;backdrop-filter:blur(14px)}
    .btn:hover{background:var(--panel-strong);border-color:var(--line-strong);transform:translateY(-1px)}
    .btn.primary{background:#e8ded4}
    .btn.approve{color:var(--good)}
    .btn.reject{color:var(--bad)}
    .btn.small{padding:8px 11px;font-size:12px}

    .login{min-height:72vh;display:grid;place-items:center}
    .login-card{width:min(100%,440px);padding:28px;border:1px solid var(--line);border-radius:28px;background:var(--panel);box-shadow:var(--shadow);backdrop-filter:blur(18px)}
    .login-card h2{margin:0 0 8px;font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:30px}
    .login-card p{margin:0 0 20px;color:var(--muted);font-size:13px;line-height:1.6}
    .field{width:100%;height:50px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.35);outline:none;padding:0 15px;color:var(--text)}
    .field:focus{border-color:var(--line-strong);background:rgba(255,255,255,.55)}
    .login-row{display:flex;gap:8px;margin-top:10px}.login-row .field{flex:1;min-width:0}
    .error{min-height:18px;margin-top:10px;color:var(--bad);font-size:12px}

    .dashboard{display:none}
    .dashboard.visible{display:block}
    .filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}
    .filter{border:1px solid var(--line);background:rgba(255,255,255,.25);color:var(--muted);border-radius:999px;padding:8px 12px;cursor:pointer;font-size:12px}
    .filter.active{background:rgba(255,255,255,.66);color:var(--text);border-color:var(--line-strong)}

    .stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:0 0 18px}
    .stat{padding:16px;border:1px solid var(--line);border-radius:20px;background:rgba(255,255,255,.28);backdrop-filter:blur(12px)}
    .stat b{display:block;font-size:24px;font-weight:500}.stat span{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.09em}

    .list{display:grid;gap:10px}
    .app{border:1px solid var(--line);border-radius:24px;background:rgba(255,255,255,.31);overflow:hidden;backdrop-filter:blur(14px);box-shadow:0 8px 30px rgba(45,41,38,.025)}
    .app-head{width:100%;border:0;background:transparent;padding:17px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:16px;align-items:center;text-align:left;cursor:pointer;color:inherit}
    .who{min-width:0}.who strong{font-size:15px;font-weight:600}.who .phone{margin-left:9px;color:var(--muted);font-size:12px}.who .date{display:block;margin-top:4px;color:var(--muted);font-size:11px}
    .score{font-family:Georgia,"Times New Roman",serif;font-size:25px;color:var(--text)}
    .score small{font-family:inherit;font-size:12px;color:var(--muted)}
    .badge{border:1px solid var(--line);border-radius:999px;padding:6px 9px;font-size:10px;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
    .badge.pending{color:var(--wait)}.badge.approved{color:var(--good)}.badge.rejected{color:var(--bad)}.badge.waiting{color:var(--muted)}

    .app-body{display:none;border-top:1px solid var(--line);padding:18px}
    .app.open .app-body{display:block}
    .reason{padding:13px 14px;border-radius:16px;background:rgba(255,255,255,.34);font-size:12.5px;line-height:1.6;color:var(--muted);margin-bottom:14px}
    .reason b{color:var(--text)}
    .answers{display:grid;gap:10px}
    .answer{padding:14px;border:1px solid rgba(45,41,38,.055);border-radius:18px;background:rgba(255,255,255,.20)}
    .answer label{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px}
    .answer p{margin:0;font-size:13px;line-height:1.65;white-space:pre-wrap}
    .review-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;flex-wrap:wrap}
    .contact{font-size:12px;color:var(--muted)}
    .review-actions{display:flex;gap:7px}

    .empty{padding:70px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:24px;background:rgba(255,255,255,.18)}
    .loading{padding:60px 20px;text-align:center;color:var(--muted)}

    @media(max-width:760px){
      .wrap{width:min(100% - 20px,1180px);padding-top:24px}
      .topbar{align-items:flex-start;flex-direction:column}
      .actions{justify-content:flex-start}
      .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
      .app-head{grid-template-columns:minmax(0,1fr) auto;gap:10px}.badge{grid-column:1/-1;width:max-content}.score{font-size:22px}
      .who .phone{display:block;margin:4px 0 0}.review-row{align-items:flex-start;flex-direction:column}
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="login" id="loginView">
      <div class="login-card">
        <h2>Butterfly Club</h2>
        <p>Private application review.</p>
        <input class="field" id="workerUrl" placeholder="Cloudflare Worker URL" autocomplete="url" />
        <div class="login-row">
          <input class="field" id="adminToken" type="password" placeholder="Admin access key" autocomplete="current-password" />
          <button class="btn primary" id="loginBtn">Enter</button>
        </div>
        <div class="error" id="loginError"></div>
      </div>
    </section>

    <section class="dashboard" id="dashboard">
      <header class="topbar">
        <div class="brand">
          <h1>Butterfly Club</h1>
          <p>Application review</p>
        </div>
        <div class="actions">
          <button class="btn" id="refreshBtn">Refresh</button>
          <button class="btn" id="logoutBtn">Lock</button>
        </div>
      </header>

      <section class="stats">
        <div class="stat"><b id="statPending">0</b><span>Pending</span></div>
        <div class="stat"><b id="statApproved">0</b><span>Approved</span></div>
        <div class="stat"><b id="statRejected">0</b><span>Human rejected</span></div>
        <div class="stat"><b id="statAiRejected">0</b><span>AI rejected</span></div>
        <div class="stat"><b id="statTotal">0</b><span>Total applications</span></div>
      </section>

      <nav class="filters" id="filters">
        <button class="filter active" data-filter="pending">Needs review</button>
        <button class="filter" data-filter="approved">Approved</button>
        <button class="filter" data-filter="rejected">Human rejected</button>
        <button class="filter" data-filter="ai_rejected">AI rejected</button>
        <button class="filter" data-filter="all">All applications</button>
      </nav>

      <div id="content" class="loading">Loading applications…</div>
    </section>
  </main>

  <script>
    const DEFAULT_WORKER_URL = "https://butterfly-club-api.mehdivalipour-co.workers.dev";

    const loginView = document.getElementById("loginView");
    const dashboard = document.getElementById("dashboard");
    const workerUrlInput = document.getElementById("workerUrl");
    const tokenInput = document.getElementById("adminToken");
    const loginBtn = document.getElementById("loginBtn");
    const loginError = document.getElementById("loginError");
    const content = document.getElementById("content");
    const refreshBtn = document.getElementById("refreshBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const filters = document.getElementById("filters");

    let filter = "pending";
    let applications = [];

    workerUrlInput.value = localStorage.getItem("butterfly_worker_url") || DEFAULT_WORKER_URL;
    tokenInput.value = sessionStorage.getItem("butterfly_admin_token") || "";

    function apiBase() {
      return workerUrlInput.value.trim().replace(/\/$/, "");
    }

    function token() {
      return sessionStorage.getItem("butterfly_admin_token") || tokenInput.value.trim();
    }

    function authHeaders() {
      return { "Authorization": `Bearer ${token()}` };
    }

    function escapeHtml(value = "") {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatDate(value) {
      if (!value) return "—";
      const d = new Date(value.replace(" ", "T") + "Z");
      return Number.isNaN(d.getTime()) ? value : d.toLocaleString();
    }

    async function api(path, options = {}) {
      const res = await fetch(`${apiBase()}${path}`, {
        ...options,
        headers: {
          ...authHeaders(),
          ...(options.body ? { "Content-Type": "application/json" } : {}),
          ...(options.headers || {})
        }
      });

      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
      return data;
    }

    function updateStats(stats = {}) {
      document.getElementById("statPending").textContent = stats.pending || 0;
      document.getElementById("statApproved").textContent = stats.approved || 0;
      document.getElementById("statRejected").textContent = stats.rejected || 0;
      document.getElementById("statAiRejected").textContent = stats.aiRejected || 0;
      document.getElementById("statTotal").textContent = stats.total || 0;
    }

    function reviewBadge(app) {
      if (app.status === "reject") return `<span class="badge rejected">AI rejected</span>`;
      if (!app.name || !app.phone) return `<span class="badge waiting">Awaiting contact</span>`;
      if (app.review_status === "approved") return `<span class="badge approved">Approved</span>`;
      if (app.review_status === "rejected") return `<span class="badge rejected">Rejected</span>`;
      return `<span class="badge pending">Needs review</span>`;
    }

    function render() {
      if (!applications.length) {
        content.className = "empty";
        content.textContent = filter === "pending" ? "No applications need review." : "No applications here yet.";
        return;
      }

      content.className = "list";
      content.innerHTML = applications.map(app => `
        <article class="app" data-id="${app.id}">
          <button class="app-head" type="button" data-toggle="${app.id}">
            <div class="who">
              <strong>${escapeHtml(app.name || "Unnamed applicant")}</strong>
              <span class="phone">${escapeHtml(app.phone || "Contact not submitted yet")}</span>
              <span class="date">${escapeHtml(formatDate(app.submitted_at || app.created_at))}</span>
            </div>
            <div class="score">${Number(app.score) || 0}<small>/100</small></div>
            ${reviewBadge(app)}
          </button>
          <div class="app-body">
            <div class="reason"><b>AI note:</b> ${escapeHtml(app.ai_reason || "—")}</div>
            <div class="answers">
              <div class="answer"><label>Why do you want to join?</label><p>${escapeHtml(app.answer_1)}</p></div>
              <div class="answer"><label>What do you bring to the room?</label><p>${escapeHtml(app.answer_2)}</p></div>
              <div class="answer"><label>What are you obsessed with right now?</label><p>${escapeHtml(app.answer_3)}</p></div>
            </div>
            <div class="review-row">
              <div class="contact">${app.name && app.phone ? `${escapeHtml(app.name)} · ${escapeHtml(app.phone)}` : "Waiting for the applicant to submit contact details."}</div>
              <div class="review-actions">
                ${app.status === "reject"
                  ? '<span class="contact">AI rejected before contact details were requested.</span>'
                  : `<button class="btn small approve" data-review="approved" data-id="${app.id}" ${!app.name || !app.phone ? "disabled" : ""}>Final Accept</button>
                     <button class="btn small reject" data-review="rejected" data-id="${app.id}">Reject</button>`}
              </div>
            </div>
          </div>
        </article>
      `).join("");
    }

    async function loadApplications() {
      content.className = "loading";
      content.textContent = "Loading applications…";
      try {
        const data = await api(`/admin/applications?filter=${encodeURIComponent(filter)}`);
        applications = data.applications || [];
        updateStats(data.stats || {});
        render();
      } catch (error) {
        if (/unauthorized/i.test(error.message)) {
          logout();
          loginError.textContent = "Invalid admin access key.";
          return;
        }
        content.className = "empty";
        content.textContent = error.message;
      }
    }

    async function login() {
      loginError.textContent = "";
      const url = apiBase();
      const access = tokenInput.value.trim();
      if (!url || url.includes("YOUR-WORKER")) {
        loginError.textContent = "Enter your deployed Worker URL.";
        return;
      }
      if (!access) {
        loginError.textContent = "Enter the admin access key.";
        return;
      }

      localStorage.setItem("butterfly_worker_url", url);
      sessionStorage.setItem("butterfly_admin_token", access);
      try {
        await api("/admin/applications?filter=pending");
        loginView.style.display = "none";
        dashboard.classList.add("visible");
        await loadApplications();
      } catch (error) {
        sessionStorage.removeItem("butterfly_admin_token");
        loginError.textContent = error.message === "Unauthorized." ? "Invalid admin access key." : error.message;
      }
    }

    function logout() {
      sessionStorage.removeItem("butterfly_admin_token");
      tokenInput.value = "";
      dashboard.classList.remove("visible");
      loginView.style.display = "grid";
    }

    loginBtn.addEventListener("click", login);
    tokenInput.addEventListener("keydown", e => { if (e.key === "Enter") login(); });
    refreshBtn.addEventListener("click", loadApplications);
    logoutBtn.addEventListener("click", logout);

    filters.addEventListener("click", async e => {
      const button = e.target.closest("[data-filter]");
      if (!button) return;
      filter = button.dataset.filter;
      filters.querySelectorAll(".filter").forEach(el => el.classList.toggle("active", el === button));
      await loadApplications();
    });

    content.addEventListener("click", async e => {
      const toggle = e.target.closest("[data-toggle]");
      if (toggle) {
        toggle.closest(".app").classList.toggle("open");
        return;
      }

      const review = e.target.closest("[data-review]");
      if (!review) return;
      const id = Number(review.dataset.id);
      const reviewStatus = review.dataset.review;
      review.disabled = true;
      try {
        await api(`/admin/applications/${id}/review`, {
          method: "POST",
          body: JSON.stringify({ reviewStatus })
        });
        await loadApplications();
      } catch (error) {
        alert(error.message);
        review.disabled = false;
      }
    });

    if (tokenInput.value && !workerUrlInput.value.includes("YOUR-WORKER")) {
      login();
    }
  </script>
</body>
</html>
